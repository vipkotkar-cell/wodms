<style>
/* Delivery Appointment Modal Styles */
.delivery-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 2000;
  align-items: center;
  justify-content: center;
}

.delivery-modal.show {
  display: flex;
}

.delivery-modal-content {
  background: white;
  border-radius: 8px;
  padding: 30px;
  max-width: 500px;
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.delivery-modal h3 {
  margin: 0 0 20px 0;
  color: #2E75B6;
  font-size: 24px;
}

.delivery-form-group {
  margin-bottom: 20px;
}

.delivery-form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: #333;
}

.delivery-form-group input,
.delivery-form-group select {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 14px;
  box-sizing: border-box;
}

.delivery-form-group small {
  display: block;
  margin-top: 5px;
  color: #666;
  font-size: 12px;
}

.suggested-date {
  background: #E2F0D9;
  padding: 12px;
  border-radius: 4px;
  margin-top: 8px;
  border-left: 4px solid #70AD47;
}

.suggested-date strong {
  color: #70AD47;
}

.override-reason {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #FFF3CD;
  border-left: 4px solid #FFC107;
  border-radius: 4px;
}

.override-reason.show {
  display: block;
}

.override-reason label {
  color: #856404;
  font-weight: 600;
  margin-bottom: 8px;
}

.override-reason textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #FFC107;
  border-radius: 4px;
  min-height: 80px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  box-sizing: border-box;
}

.delivery-modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 25px;
  justify-content: flex-end;
}

.delivery-modal-actions button {
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
}

.btn-cancel {
  background: #6c757d;
  color: white;
}

.btn-cancel:hover {
  background: #5a6268;
}

.btn-confirm {
  background: #70AD47;
  color: white;
}

.btn-confirm:hover {
  background: #5a8c38;
}

.btn-confirm:disabled {
  background: #ccc;
  cursor: not-allowed;
}

/* Date changed indicator */
.date-changed {
  background: #FFF3CD !important;
  border-color: #FFC107 !important;
}
</style>

<!-- HTML Modal -->
<div id="delivery-appointment-modal" class="delivery-modal">
  <div class="delivery-modal-content">
    <h3>📅 Set Delivery Appointment</h3>
    
    <div class="delivery-form-group">
      <label for="delivery-pickup-date">Pickup Date (Actual) *</label>
      <input type="date" id="delivery-pickup-date" required>
      <small>Enter the actual date when pickup happened</small>
    </div>
    
    <div class="delivery-form-group">
      <label for="delivery-expected-date">Expected Delivery Date *</label>
      <input type="date" id="delivery-expected-date" required>
      
      <div class="suggested-date" id="suggested-date-box">
        <strong>💡 Suggested Date:</strong> 
        <span id="suggested-date-value">Calculating...</span>
        <small style="display: block; margin-top: 5px;">
          Based on route TAT from <span id="route-origin"></span>
        </small>
      </div>
    </div>
    
    <div class="delivery-form-group">
      <label for="delivery-time-slot">Delivery Time Slot *</label>
      <select id="delivery-time-slot" required>
        <option value="">Select time slot</option>
        <option value="09:00 AM - 10:00 AM">09:00 AM - 10:00 AM</option>
        <option value="10:00 AM - 11:00 AM">10:00 AM - 11:00 AM</option>
        <option value="11:00 AM - 12:00 PM">11:00 AM - 12:00 PM</option>
        <option value="12:00 PM - 01:00 PM">12:00 PM - 01:00 PM</option>
        <option value="01:00 PM - 02:00 PM">01:00 PM - 02:00 PM</option>
        <option value="02:00 PM - 03:00 PM">02:00 PM - 03:00 PM</option>
        <option value="03:00 PM - 04:00 PM">03:00 PM - 04:00 PM</option>
      </select>
      <small>Appointments available from 9 AM to 4 PM</small>
    </div>
    
    <!-- Override Reason (shows when date changed) -->
    <div class="override-reason" id="override-reason-box">
      <label for="override-reason">
        ⚠️ Why are you changing the suggested date?
      </label>
      <textarea 
        id="override-reason" 
        placeholder="Example: Customer requested earlier delivery, Route delay expected due to weather, Priority shipment, etc."
        maxlength="500"
      ></textarea>
      <small style="color: #856404;">Required when delivery date differs from suggested</small>
    </div>
    
    <div class="delivery-modal-actions">
      <button type="button" class="btn-cancel" onclick="closeDeliveryModal()">
        Cancel
      </button>
      <button type="button" class="btn-confirm" id="btn-confirm-appointment" onclick="confirmDeliveryAppointment()">
        Confirm Pickup & Set Appointment
      </button>
    </div>
  </div>
</div>

<!-- JavaScript -->
<script>
// Global variables for delivery modal
let currentDeliveryToken = null;
let suggestedDeliveryDate = null;

/**
 * Open delivery appointment modal
 */
function openDeliveryModal(tokenId, origin) {
  currentDeliveryToken = tokenId;
  
  // Show modal
  document.getElementById('delivery-appointment-modal').classList.add('show');
  
  // Set today as default pickup date
  const today = new Date();
  document.getElementById('delivery-pickup-date').valueAsDate = today;
  
  // Store origin for display
  document.getElementById('route-origin').textContent = origin;
  
  // Calculate suggested delivery date
  calculateSuggestedDeliveryDate(today, origin);
  
  // Reset form
  document.getElementById('delivery-expected-date').value = '';
  document.getElementById('delivery-time-slot').value = '';
  document.getElementById('override-reason').value = '';
  document.getElementById('override-reason-box').classList.remove('show');
  document.getElementById('delivery-expected-date').classList.remove('date-changed');
}

/**
 * Close delivery modal
 */
function closeDeliveryModal() {
  document.getElementById('delivery-appointment-modal').classList.remove('show');
  currentDeliveryToken = null;
  suggestedDeliveryDate = null;
}

/**
 * Calculate suggested delivery date based on pickup date and TAT
 */
function calculateSuggestedDeliveryDate(pickupDate, origin) {
  showLoader("Calculating delivery date...");
  
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoader();
      
      if (result) {
        suggestedDeliveryDate = new Date(result);
        
        // Format date for display
        const options = { day: '2-digit', month: 'short', year: 'numeric' };
        const formattedDate = suggestedDeliveryDate.toLocaleDateString('en-IN', options);
        
        document.getElementById('suggested-date-value').textContent = formattedDate;
        
        // Set as default value in date picker
        document.getElementById('delivery-expected-date').valueAsDate = suggestedDeliveryDate;
      }
    })
    .withFailureHandler(function(error) {
      hideLoader();
      console.error('Calculate delivery date error:', error);
      
      // Fallback: +5 days
      const fallbackDate = new Date(pickupDate);
      fallbackDate.setDate(fallbackDate.getDate() + 5);
      suggestedDeliveryDate = fallbackDate;
      
      document.getElementById('suggested-date-value').textContent = 
        fallbackDate.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + 
        ' (default +5 days)';
      
      document.getElementById('delivery-expected-date').valueAsDate = fallbackDate;
    })
    .getSuggestedDeliveryDate(pickupDate.toISOString(), origin);
}

/**
 * Handle pickup date change - recalculate suggested delivery
 */
document.addEventListener('DOMContentLoaded', function() {
  const pickupDateInput = document.getElementById('delivery-pickup-date');
  
  if (pickupDateInput) {
    pickupDateInput.addEventListener('change', function() {
      const pickupDate = new Date(this.value);
      const origin = document.getElementById('route-origin').textContent;
      
      if (pickupDate && origin) {
        calculateSuggestedDeliveryDate(pickupDate, origin);
      }
    });
  }
  
  // Handle delivery date change - show override reason if different
  const deliveryDateInput = document.getElementById('delivery-expected-date');
  
  if (deliveryDateInput) {
    deliveryDateInput.addEventListener('change', function() {
      checkIfDateOverridden();
    });
  }
});

/**
 * Check if user changed the suggested date
 */
function checkIfDateOverridden() {
  const selectedDate = new Date(document.getElementById('delivery-expected-date').value);
  
  if (!suggestedDeliveryDate || !selectedDate) return;
  
  // Compare dates (ignore time)
  const selected = selectedDate.toDateString();
  const suggested = suggestedDeliveryDate.toDateString();
  
  const overrideBox = document.getElementById('override-reason-box');
  const dateInput = document.getElementById('delivery-expected-date');
  
  if (selected !== suggested) {
    // User changed the date - require reason
    overrideBox.classList.add('show');
    dateInput.classList.add('date-changed');
  } else {
    // Using suggested date - no reason needed
    overrideBox.classList.remove('show');
    dateInput.classList.remove('date-changed');
    document.getElementById('override-reason').value = '';
  }
}

/**
 * Confirm delivery appointment
 */
function confirmDeliveryAppointment() {
  // Validate form
  const pickupDate = document.getElementById('delivery-pickup-date').value;
  const deliveryDate = document.getElementById('delivery-expected-date').value;
  const timeSlot = document.getElementById('delivery-time-slot').value;
  
  if (!pickupDate || !deliveryDate || !timeSlot) {
    showToast('Please fill all required fields', 'error');
    return;
  }
  
  // Check if override reason needed
  const selected = new Date(deliveryDate).toDateString();
  const suggested = suggestedDeliveryDate ? suggestedDeliveryDate.toDateString() : selected;
  const isOverridden = (selected !== suggested);
  
  const overrideReason = document.getElementById('override-reason').value.trim();
  
  if (isOverridden && !overrideReason) {
    showToast('Please provide a reason for changing the delivery date', 'warning');
    document.getElementById('override-reason').focus();
    return;
  }
  
  // Disable button during submission
  const btn = document.getElementById('btn-confirm-appointment');
  btn.disabled = true;
  btn.textContent = 'Processing...';
  
  showLoader("Confirming pickup and setting appointment...");
  
  // Call backend
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoader();
      btn.disabled = false;
      btn.textContent = 'Confirm Pickup & Set Appointment';
      
      if (result.success) {
        let message = '✅ Pickup confirmed and delivery appointment set!';
        
        if (result.overridden) {
          message += '\n📝 Override reason recorded.';
        }
        
        showToast(message, 'success');
        closeDeliveryModal();
        
        // Reload Step 3 to remove this token from list
        loadS3();
      } else {
        showToast('Error: ' + result.error, 'error');
      }
    })
    .withFailureHandler(function(error) {
      hideLoader();
      btn.disabled = false;
      btn.textContent = 'Confirm Pickup & Set Appointment';
      showToast('Failed to confirm pickup: ' + error.message, 'error');
    })
    .confirmPickupWithAppointment(
      currentDeliveryToken,
      pickupDate,
      deliveryDate,
      timeSlot,
      overrideReason || ''
    );
}

/**
 * Quick helper to show toast notifications
 */
function showToast(message, type) {
  // Implement your toast notification here
  // Or use simple alert for now
  if (type === 'error') {
    alert('❌ ' + message);
  } else if (type === 'success') {
    alert('✅ ' + message);
  } else if (type === 'warning') {
    alert('⚠️ ' + message);
  } else {
    alert(message);
  }
}

/**
 * Show/hide loader
 */
function showLoader(message) {
  // Implement your loader UI
  console.log('Loading:', message);
}

function hideLoader() {
  // Implement your loader UI
  console.log('Loading complete');
}

/**
 * Example: Call this from Step 3 "Update Pickup" button
 */
function showDeliveryAppointmentForToken(tokenId, origin) {
  openDeliveryModal(tokenId, origin);
}
</script>
